<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثريا الدوائر المتمركزة - العرض التفاعلي للعميل</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        .client-header {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            pointer-events: none;
            z-index: 10;
        }
        .client-header h1 { font-size: 1.4rem; color: #000; margin-bottom: 5px; }
        .client-header p { font-size: 0.9rem; color: #555; }
    </style>
</head>
<body>

    <div class="client-header">
        <h1>معاينة ثريا الدوائر المتمركزة ⭕</h1>
        <p>عرض تفاعلي ثلاثي الأبعاد 3D للعميل</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const chandelierGroup = new THREE.Group();
        scene.add(chandelierGroup);

        const maxDiameter = 230;
        const ringStep = 20;
        const pointSpacing = 12;
        const minL = 40;
        const maxL = 200;
        const maxRadius = maxDiameter / 2;

        let gridData = [];
        let ringsInfo = [];
        let id = 1;

        // المركز
        gridData.push({
            id: id++,
            ringIndex: 0,
            ringDiameter: 0,
            radius: 0,
            angleRad: 0,
            x: 0,
            y: 0
        });
        ringsInfo.push({ ringIndex: 0, diameter: 0 });

        let ringIdx = 1;
        for (let d = ringStep; d <= maxDiameter; d += ringStep) {
            let r = d / 2;
            let circumference = 2 * Math.PI * r;
            let numPoints = Math.max(4, Math.round(circumference / pointSpacing));

            for (let i = 0; i < numPoints; i++) {
                let angle = (i / numPoints) * Math.PI * 2;
                let x = r * Math.cos(angle);
                let y = r * Math.sin(angle);

                gridData.push({
                    id: id++,
                    ringIndex: ringIdx,
                    ringDiameter: d,
                    radius: r,
                    angleRad: angle,
                    x: Math.round(x * 10) / 10,
                    y: Math.round(y * 10) / 10
                });
            }
            ringsInfo.push({ ringIndex: ringIdx, diameter: d });
            ringIdx++;
        }

        // تطبيق طول الأوتار (النمط 31)
        gridData.forEach(p => {
            let normRadius = maxRadius > 0 ? p.radius / maxRadius : 0;
            let sharpFactor = Math.pow(1 - normRadius, 2);
            p.dropLength = Math.round(minL + (maxL - minL) * sharpFactor);
        });

        // إنشاء قاعدة الثريا
        const baseGeo = new THREE.CylinderGeometry(maxRadius + 2, maxRadius + 2, 1, 64);
        const baseMat = new THREE.MeshBasicMaterial({ color: 0xdddddd });
        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
        chandelierGroup.add(baseMesh);

        // إنشاء الحلقات
        ringsInfo.forEach(rInfo => {
            if(rInfo.diameter > 0) {
                let r = rInfo.diameter / 2;
                let ringGeo = new THREE.RingGeometry(r - 0.3, r + 0.3, 64);
                let ringMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
                let ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2;
                ringMesh.position.y = -0.6;
                chandelierGroup.add(ringMesh);
            }
        });

        // إنشاء الأوتار والكرات
        const sphereGeo = new THREE.SphereGeometry(1.5, 12, 12);
        const cMat = new THREE.LineBasicMaterial({ color: 0x000000 });
        const sMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        gridData.forEach(p => {
            if (p.dropLength > 0) {
                const points = [
                    new THREE.Vector3(p.x, 0, p.y),
                    new THREE.Vector3(p.x, -p.dropLength, p.y)
                ];
                const cableGeo = new THREE.BufferGeometry().setFromPoints(points);
                const cable = new THREE.Line(cableGeo, cMat);
                chandelierGroup.add(cable);

                const crystal = new THREE.Mesh(sphereGeo, sMat);
                crystal.position.set(p.x, -p.dropLength, p.y);
                chandelierGroup.add(crystal);
            }
        });

        camera.position.set(maxDiameter * 1.3, maxDiameter * 0.9, maxDiameter * 1.3);
        controls.target.set(0, -50, 0);
        controls.update();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
