<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قارئ الباركود المستمر</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f4f4f9;
    }

    .container {
      max-width: 450px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }

    .btn-danger {
      background-color: #dc3545;
    }

    /* النافذة المنبثقة */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
    }

    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
    }

    /* تنسيق قائمة الباركود */
    .list-container {
      margin-top: 20px;
      text-align: right;
    }

    ul {
      list-style-type: none;
      padding: 0;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    li {
      padding: 10px 15px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fafafa;
    }

    li:nth-child(even) {
      background-color: #fff;
    }

    .badge {
      background: #007bff;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>قارئ الباركود المستمر</h2>
    
    <button onclick="openScanner()">فتح الكاميرا ومسح الكل</button>
    
    <!-- قائمة الأكواد المسجلة -->
    <div class="list-container">
      <h3>الأكواد المسجلة (<span id="count">0</span>):</h3>
      <ul id="barcodeList">
        <!-- تضاف الأكواد هنا تلقائياً -->
      </ul>
      <button class="btn-danger" onclick="clearList()">مسح القائمة</button>
    </div>
  </div>

  <!-- النافذة المنبثقة للكانير -->
  <div id="scannerModal" class="modal">
    <div class="modal-content">
      <h3>الكاميرا تعمل... وجّه الباركود</h3>
      <div id="reader"></div>
      <p id="statusMessage" style="color: green; font-weight: bold; height: 20px;"></p>
      <button class="btn-danger" onclick="closeScanner()">إغلاق الكاميرا</button>
    </div>
  </div>

  <script>
    let html5QrcodeScanner = null;
    let lastScannedCode = "";
    let lastScannedTime = 0;
    let scanCount = 0;

    function openScanner() {
      document.getElementById('scannerModal').style.display = 'flex';

      html5QrcodeScanner = new Html5Qrcode("reader");

      const config = { 
        fps: 15, 
        qrbox: { width: 300, height: 100 },
        formatsToSupport: [ 
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.UPC_A
        ]
      };

      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        alert("خطأ في تشغيل الكاميرا: " + err);
        closeScanner();
      });
    }

    function onScanSuccess(decodedText) {
      const currentTime = Date.now();

      // تجنب القراءة المكررة لنفس الكود خلال ثانيتين (2000 مللي ثانية)
      if (decodedText === lastScannedCode && (currentTime - lastScannedTime) < 2000) {
        return;
      }

      lastScannedCode = decodedText;
      lastScannedTime = currentTime;

      // إضافة الكود للقائمة
      addBarcodeToList(decodedText);

      // تنبيه مرئي سريع داخل النافذة المنبثقة
      const statusMsg = document.getElementById('statusMessage');
      statusMsg.innerText = `تم قراءة: ${decodedText}`;
      setTimeout(() => { statusMsg.innerText = ""; }, 1500);
    }

    function addBarcodeToList(code) {
      scanCount++;
      document.getElementById('count').innerText = scanCount;

      const list = document.getElementById('barcodeList');
      const li = document.createElement('li');
      
      const timeString = new Date().toLocaleTimeString('ar-SA');
      
      li.innerHTML = `
        <span><strong>${code}</strong></span>
        <span class="badge">${timeString}</span>
      `;

      // إضافة العنصر الجديد في أعلى القائمة
      list.insertBefore(li, list.firstChild);
    }

    function clearList() {
      document.getElementById('barcodeList').innerHTML = "";
      scanCount = 0;
      document.getElementById('count').innerText = 0;
    }

    function closeScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          document.getElementById('scannerModal').style.display = 'none';
        }).catch(() => {
          document.getElementById('scannerModal').style.display = 'none';
        });
      } else {
        document.getElementById('scannerModal').style.display = 'none';
      }
    }
  </script>

</body>
</html>
