<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قارئ الباركود الخطي</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 30px;
      text-align: center;
      background-color: #f4f4f9;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input[type="text"] {
      width: 90%;
      padding: 12px;
      margin: 15px 0;
      font-size: 18px;
      border: 2px solid #ddd;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      letter-spacing: 1px;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
    }

    #reader {
      width: 100%;
    }

    .close-btn {
      margin-top: 15px;
      background-color: #dc3545;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>مسح باركود (Code 39 / خطوط)</h2>
    <input type="text" id="barcodeResult" placeholder="رقم الباركود..." readonly>
    <br>
    <button onclick="openScanner()">مسح الباركود</button>
  </div>

  <div id="scannerModal" class="modal">
    <div class="modal-content">
      <h3>ضع الخطوط داخل المستطيل</h3>
      <div id="reader"></div>
      <button class="close-btn" onclick="closeScanner()">إغلاق</button>
    </div>
  </div>

  <script>
    let html5QrcodeScanner = null;

    function openScanner() {
      document.getElementById('scannerModal').style.display = 'flex';

      html5QrcodeScanner = new Html5Qrcode("reader");

      // إعدادات مستطيل المسح أفقي يناسب الباركود الخطي (عرض أطول وارتفاع أقل)
      const config = { 
        fps: 15, 
        qrbox: { width: 300, height: 100 },
        // تحديد الأنواع المقبولة (Code 39 + الأنواع الخطية الشائعة)
        formatsToSupport: [ 
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.UPC_A
        ]
      };

      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        alert("خطأ في تشغيل الكاميرا: " + err);
        closeScanner();
      });
    }

    function onScanSuccess(decodedText) {
      document.getElementById('barcodeResult').value = decodedText;
      closeScanner();
    }

    function closeScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          document.getElementById('scannerModal').style.display = 'none';
        }).catch(() => {
          document.getElementById('scannerModal').style.display = 'none';
        });
      } else {
        document.getElementById('scannerModal').style.display = 'none';
      }
    }
  </script>

</body>
</html>
