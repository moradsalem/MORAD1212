<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق AR القياس المباشر</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #111;
      color: #fff;
    }
    #ui-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
    }
    .card {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    #error-box {
      display: none;
      background: rgba(255, 59, 48, 0.9);
      color: #fff;
      border: none;
    }
    .btn-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 300px;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      font-size: 16px;
      background: #007aff;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-overlay">
    <div id="error-box" class="card"></div>
    <div id="status-card" class="card">
      <strong>حالة النظام:</strong> <span id="status-text">جاهز لبدء التشغيل</span>
    </div>
  </div>

  <div class="btn-container">
    <button id="start-ar-btn" class="btn">فتح الكاميرا والبدء (AR)</button>
  </div>

  <script>
    let camera, scene, renderer, hitTestSource, xrRefSpace;
    let reticle, rectGroup;

    // 1. فحص متطلبات الأمان والبروتوكول فور فتح الصفحة
    window.addEventListener('DOMContentLoaded', () => {
      const errorBox = document.getElementById('error-box');
      
      if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
        errorBox.style.display = 'block';
        errorBox.innerHTML = '⚠️ <strong>تنبيه أمان:</strong> يجب فتح الموقع عبر رابط آمن <strong>HTTPS</strong> لتتمكن الكاميرا من العمل.';
      } else if (!navigator.xr) {
        errorBox.style.display = 'block';
        errorBox.innerHTML = '⚠️ <strong>المتصفح غير مدعوم:</strong><br>• للأندرويد: يرجى فتح الرابط في Google Chrome.<br>• للآيفون: يرجى فتح الرابط عبر تطبيق WebXR Viewer.';
      }
    });

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      scene.add(light);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // مؤشر نقطة السنتر
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x00ff00 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // مجسم المستطيل 120x60 سم
      rectGroup = new THREE.Group();
      const geom = new THREE.PlaneGeometry(1.2, 0.6);
      const mat = new THREE.MeshBasicMaterial({ color: 0x007aff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
      const mesh = new THREE.Mesh(geom, mat);
      
      const centerDot = new THREE.Mesh(new THREE.SphereGeometry(0.03), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
      rectGroup.add(mesh);
      rectGroup.add(centerDot);
      rectGroup.rotation.x = Math.PI / 2;
      rectGroup.visible = false;
      scene.add(rectGroup);

      document.getElementById('start-ar-btn').addEventListener('click', startAR);
    }

    async function startAR() {
      const statusText = document.getElementById('status-text');
      const errorBox = document.getElementById('error-box');

      try {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test']
        });

        renderer.xr.setSession(session);
        document.getElementById('start-ar-btn').style.display = 'none';
        statusText.textContent = 'الكاميرا تعمل. وجّه الجوال نحو السقف ببطء...';

        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        xrRefSpace = await session.requestReferenceSpace('local');

        renderer.setAnimationLoop(render);

      } catch (err) {
        errorBox.style.display = 'block';
        errorBox.innerHTML = '❌ <strong>فشل تشغيل الكاميرا:</strong> ' + err.message + '<br>تأكد من إعطاء إذن استخدام الكاميرا للمتصفح.';
      }
    }

    function render(timestamp, frame) {
      if (frame) {
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length > 0) {
          const pose = hitTestResults[0].getPose(xrRefSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);

          rectGroup.visible = true;
          rectGroup.position.setFromMatrixPosition(reticle.matrix);
          rectGroup.quaternion.setFromRotationMatrix(reticle.matrix);

          document.getElementById('status-text').textContent = 'تم تحديد السقف والسنتر بنجاح!';
        }
      }
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
