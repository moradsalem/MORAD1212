<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قارئ الباركود</title>
  <!-- مكتبة قراءة الباركود -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 30px;
      text-align: center;
      background-color: #f4f4f9;
    }

    /* تنسيق المدخلات والأزرار */
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input[type="text"] {
      width: 90%;
      padding: 12px;
      margin: 15px 0;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      text-align: center;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* نافذة الكاميرا المنبثقة (Modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      position: relative;
    }

    #reader {
      width: 100%;
    }

    .close-btn {
      margin-top: 15px;
      background-color: #dc3545;
    }

    .close-btn:hover {
      background-color: #a71d2a;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>مسح الباركود</h2>
    <!-- الحقل الذي سيرد فيه الكود -->
    <input type="text" id="barcodeResult" placeholder="سيظهر الباركود هنا..." readonly>
    <br>
    <!-- زر فتح الكاميرا -->
    <button onclick="openScanner()">فتح الكاميرا للمسح</button>
  </div>

  <!-- النافذة المنبثقة -->
  <div id="scannerModal" class="modal">
    <div class="modal-content">
      <h3>وجّه الكاميرا نحو الباركود</h3>
      <div id="reader"></div>
      <button class="close-btn" onclick="closeScanner()">إغلاق الكاميرا</button>
    </div>
  </div>

  <script>
    let html5QrcodeScanner = null;

    function openScanner() {
      // إظهار النافذة المنبثقة
      document.getElementById('scannerModal').style.display = 'flex';

      // تهيئة القارئ
      html5QrcodeScanner = new Html5Qrcode("reader");

      const config = { 
        fps: 10, 
        qrbox: { width: 250, height: 150 } // أبعاد مربع المسح
      };

      // تشغيل الكاميرا الخلفية (facingMode: "environment")
      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        alert("تعذر الوصول إلى الكاميرا: " + err);
        closeScanner();
      });
    }

    // الدالة التي تعمل فور قراءة الباركود بنجاح
    function onScanSuccess(decodedText) {
      // كتابة النتيجة في حقل النص
      document.getElementById('barcodeResult').value = decodedText;
      
      // إغلاق النافذة والكاميرا فوراً
      closeScanner();
    }

    // إيقاف الكاميرا وإغلاق النافذة
    function closeScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          document.getElementById('scannerModal').style.display = 'none';
        }).catch(err => {
          document.getElementById('scannerModal').style.display = 'none';
        });
      } else {
        document.getElementById('scannerModal').style.display = 'none';
      }
    }
  </script>

</body>
</html>
