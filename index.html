<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>تحديد السقف والسنتر - Safari AR</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }
    /* تغذية الكاميرا المباشرة */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    /* طبقة رسم عناصر الـ 3D فوق الكاميرا */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 10;
    }
    .card {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #btn-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 80%;
    }
    .btn {
      width: 100%;
      padding: 16px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- كاميرا الهاتف المباشرة -->
  <video id="webcam" autoplay playsinline muted></video>
  
  <!-- كانفاس الرسم 3D -->
  <div id="canvas-container"></div>

  <div id="ui">
    <div class="card" id="info">اضغط على "تشغيل الكاميرا" للبدء</div>
  </div>

  <div id="btn-container">
    <button class="btn" id="start-btn" onclick="initCamera()">تشغيل الكاميرا ورسم السقف</button>
  </div>

  <script>
    let scene, camera, renderer, rectGroup;

    async function initCamera() {
      const video = document.getElementById('webcam');
      const info = document.getElementById('info');
      const startBtn = document.getElementById('start-btn');

      try {
        // طلب وصول مباشر لكاميرا الآيفون الخلفية
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } },
          audio: false
        });
        
        video.srcObject = stream;
        startBtn.style.display = 'none';
        info.innerHTML = '<strong>تم تشغيل الكاميرا!</strong><br>تم تثبيت مستطيل 120×60 سم مع تحديد السنتر الأحمر في منتصف الشاشة.';

        initThreeJS();
      } catch (err) {
        // في حال عدم وجود كاميرا خلفية بدعم exact، نطلب الكاميرا العامة
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          video.srcObject = stream;
          startBtn.style.display = 'none';
          initThreeJS();
        } catch (e) {
          alert('تعذر فتح الكاميرا، يرجى السماح بصلحية الكاميرا من إعدادات Safari.');
        }
      }
    }

    function initThreeJS() {
      const container = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 2;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // إنشاء إطار ومستطيل السقف 120*60 سم (مثبت بالمشهد)
      rectGroup = new THREE.Group();

      const geometry = new THREE.PlaneGeometry(1.2, 0.6);
      const material = new THREE.MeshBasicMaterial({ color: 0x007aff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
      const plane = new THREE.Mesh(geometry, material);

      const edges = new THREE.EdgesGeometry(geometry);
      const wireframe = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 }));
      plane.add(wireframe);

      // تحديد السنتر بكرة حمراء بارزة
      const centerMarker = new THREE.Mesh(
        new THREE.SphereGeometry(0.04, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xff3b30 })
      );

      rectGroup.add(plane);
      rectGroup.add(centerMarker);
      scene.add(rectGroup);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
